{% with date_field=date_name|default:"due_date" time_field=time_name|default:"due_time" %}
<div class="datetime-picker">
  <input type="hidden" name="user_tz" class="user-tz-field" value="">
  <div class="datetime-picker-part">
    <label class="datetime-picker-label" for="{{ date_field }}">Date</label>
    <div class="picker-wrap">
      <input type="date" id="{{ date_field }}" name="{{ date_field }}" class="form-input"
             {% if value_date %}value="{{ value_date }}"{% endif %}
             {% if required %}required{% endif %}>
      <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
  </div>

  <div class="datetime-picker-part">
    <label class="datetime-picker-label" for="{{ time_field }}">Time</label>
    <div class="picker-wrap">
      <input type="time" id="{{ time_field }}" name="{{ time_field }}" class="form-input"
             {% if value_time %}value="{{ value_time }}"{% endif %}
             {% if required %}required{% endif %}>
      <svg class="picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
  </div>
</div>
{% endwith %}
<script>
(function () {
  var tzName = '';
  try {
    tzName = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  } catch (err) {}
  document.querySelectorAll('.user-tz-field').forEach(function (field) {
    field.value = tzName;
  });
})();
</script>
